[workspace]
resolver = "2"
members = [
  # "packages/blob",
  "packages/cli",
  "packages/core",
  # "packages/hooks",
  "packages/proxy",
  # "packages/sdk",
  # "packages/sdk-macro",
  "packages/services",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jafupy/rack"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
